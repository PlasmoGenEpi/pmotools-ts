name: Release

# Push a tag such as v0.2.0, matching "version" in package.json, to publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm trusted publishing: npm exchanges this token for a one-time
      # publish credential and adds provenance. No npm token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # Node 24 ships npm 11, which trusted publishing needs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # prepack builds dist. A prerelease version (0.2.0-beta.1) goes to the
      # "next" tag so it is not installed by default.
      - name: Publish
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "pmotools-ts@$version" version >/dev/null 2>&1; then
            echo "::notice::pmotools-ts $version is already on npm; nothing to publish"
            exit 0
          fi
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
